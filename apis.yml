name: Getbasis
description: >-
  Basis (getbasis.ai) is an AI-powered accounting platform that builds autonomous
  agents purpose-built for accountants. Its agents execute accounting workflows
  end-to-end across tax, audit, advisory, and client accounting services (CAS),
  shifting accounting professionals from doing the work to reviewing it. The company
  emphasizes enterprise-grade security and compliance for accounting firms — SOC 2
  Type II, ISO 27001, and ISO 42001 certifications, AES-256 encryption, strict tenant
  isolation, and US-only hosting. Basis is backed by Khosla Ventures and was added to
  the API Evangelist network as a portfolio lead. It is a product company with no
  public developer API, SDK, or API reference at this time.
